# FreeMyXe 1.2.1 configuration file
# https://github.com/FreeMyXe/FreeMyXe

# Whether to automatically patch or boot XeLL once FreeMyXe is running.
# Valid options:
# off   = Default, shows FreeMyXe prompt.
# patch = Auto patch hypervisor/HV and kernel without being asked.
# xell  = Auto launch XeLL without being asked.
#
# Info: https://github.com/FreeMyXe/FreeMyXe/wiki/Automatic-Patching
[Auto]
Default=xell
Eject=off

# This will load system-level plugins after patching the kernel and hypervisor.
# Please know that only a small number of plugins will work without Dashlaunch.
# For example:
# plugin=RB3ELoader.xex
#
# Info: https://github.com/FreeMyXe/FreeMyXe/wiki/Plugin-Loader
[Plugins]
